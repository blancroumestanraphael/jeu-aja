[build]
  publish = "."
  command = ""

[functions]
  node_bundler = "esbuild"
  included_files = ["src/data/**", "server/content/**"]

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"
