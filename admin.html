<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Génération AJA — Administration</title>
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --blue: #0a3d91; --ink: #0d1b33; --muted: #5c6b85; --line: #dde5f2; --bg: #f3f6fb; --green: #1f9d55; --red: #d64545; --gold: #e3a400; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
    body { margin: 0; background: var(--bg); }
    header { background: var(--blue); color: #fff; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 1.1rem; margin: 0; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
    .card { background: #fff; border-radius: 14px; padding: 16px; box-shadow: 0 1px 3px rgba(10,30,70,.08); }
    h2 { font-size: 1rem; margin: 0 0 10px; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
    .kpi { background: var(--bg); border-radius: 12px; padding: 10px; }
    .kpi b { display: block; font-size: 1.5rem; color: var(--blue); }
    .kpi span { font-size: .8rem; color: var(--muted); }
    table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .bars { display: flex; align-items: flex-end; gap: 4px; height: 120px; }
    .bars div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: .65rem; color: var(--muted); }
    .bars i { display: block; width: 100%; background: var(--blue); border-radius: 4px 4px 0 0; min-height: 2px; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
    label { display: grid; gap: 3px; font-size: .78rem; font-weight: 600; color: var(--muted); }
    input, select, textarea { font: inherit; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); }
    button { font: inherit; font-weight: 700; padding: 8px 14px; border-radius: 9px; border: 1.5px solid var(--blue); background: var(--blue); color: #fff; cursor: pointer; }
    button.ghost { background: #fff; color: var(--blue); }
    button.danger { background: #fff; color: var(--red); border-color: var(--red); }
    .tag { font-size: .7rem; font-weight: 800; border-radius: 6px; padding: 1px 6px; }
    .tag.reel { background: #e7f6ed; color: var(--green); }
    .tag.fictif { background: #f1f4f9; color: var(--muted); }
    .muted { color: var(--muted); font-size: .85rem; }
    .err { color: var(--red); }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  </style>
</head>
<body>
  <header>
    <h1>Génération AJA — tableau de bord administrateur</h1>
    <form id="login" style="display:flex;gap:6px"><input id="token" type="password" placeholder="Jeton administrateur" autocomplete="off"><button>Connexion</button></form>
  </header>
  <main id="app"><p class="muted">Saisissez le jeton administrateur (variable AJA_ADMIN_TOKEN du serveur).</p></main>
  <script type="module" src="src/admin/admin.js"></script>
</body>
</html>
